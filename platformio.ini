[env:esp32-tft-128x160]
platform = espressif32@6.7.0
framework = arduino
board = esp32dev
board_build.partitions = custom_4Mb.csv
monitor_speed = 115200

build_src_filter =
  +<*>
  -<modules/subghz/*>
  -<modules/nfc/*>
  -<modules/rfid/*>

build_flags =
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DEEPROMSIZE=128
  -DLH=8
  -DLW=6
  -DESP32_TFT_128X160
  -DDEVICE_NAME='"ESP32 Custom ST7735"'
  -DBRUCE_VERSION='"Homebrew"'
  
  ; Display Configuration
  -DHAS_SCREEN=1
  -DROTATION=1
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DST7735_GREENTAB=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160

  ; Display SPI Pins
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=17
  -DTFT_BL=-1

  ; Navigation Button Pins
  -DSEL_BTN=25
  -DUP_BTN=33
  -DDW_BTN=27
  -DBTN_ALIAS='"OK"'

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  bblanchon/ArduinoJson @ 7.1.0
  lennarthennigs/Button2 @ 2.3.2
  h278235750/LovyanGFX @ 1.1.12
